<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dark Forest Ascent</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: full-screen canvas universe, HUD pinned top, action bar pinned bottom, overlays for yard / wonders / codex / map. Single dark look on purpose. */
:root{--bg:#04060c;--panel:#0a101c;--panel2:#101a2c;--line:#22304a;--fg:#d9e4f0;--dim:#7d8ca3;
--amber:#f2b84b;--red:#ff5d4d;--teal:#4fd1b5;--violet:#b58cff;--blue:#6fb7ff;color-scheme:dark;
--disp:"Chakra Petch",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font:14px var(--disp);touch-action:none;user-select:none;-webkit-user-select:none}
#app{position:relative;width:100%;height:100%;overflow:hidden}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;padding:8px max(12px,env(safe-area-inset-left,0px)) 0 max(12px,env(safe-area-inset-right,0px));pointer-events:none}
.card{background:rgba(10,16,28,.86);border:1px solid var(--line);border-radius:6px;padding:7px 9px}
#hl{min-width:0;flex:1;max-width:270px}
.lvrow{display:flex;align-items:baseline}.lvrow #lv{margin-right:8px}
#lv{font-size:26px;font-weight:700;color:var(--amber);font-variant-numeric:tabular-nums;line-height:1}
#tier{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);min-width:0}
.bar{height:5px;background:#16213a;border-radius:3px;overflow:hidden;margin:5px 0}
.bar i{display:block;height:100%;width:0;background:var(--amber);transition:width .2s}
.stats{display:grid;grid-template-columns:1fr 1fr;grid-gap:2px 10px;gap:2px 10px;font-family:var(--mono);font-size:11px;color:var(--dim)}
.stats b{color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums}
#sigw{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);display:flex;justify-content:space-between}
#hr{display:grid;justify-items:end;grid-gap:6px;gap:6px}
#mm{width:92px;height:92px;border:1px solid var(--line);border-radius:6px;background:#050912cc;pointer-events:auto;cursor:pointer}
.ib{display:grid;grid-auto-flow:column;grid-gap:5px;gap:5px;pointer-events:auto}
button{font:600 12px var(--disp);letter-spacing:.06em;color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:7px 9px;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
button:disabled{opacity:.4}
#alert{position:absolute;left:50%;top:160px;transform:translateX(-50%);width:min(92%,420px);pointer-events:none}
.al{margin-bottom:5px;width:100%;box-sizing:border-box;text-align:center;font-weight:700;font-size:12px;letter-spacing:.06em;padding:6px 8px;border-radius:6px;border:1px solid var(--red);background:#2a0d0fdd;color:#ffb3aa}
.al.v{border-color:var(--violet);background:#1d1230dd;color:#d9c4ff}
#toasts{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:262px;pointer-events:none;max-width:calc(100% - 110px)}
.t{margin-top:4px;font-size:12px;padding:5px 8px;border-radius:5px;background:#0a101ccc;border-left:3px solid var(--blue);animation:fade 6s forwards}
.t.good{border-color:var(--teal)}.t.bad{border-color:var(--red)}.t.epic{border-color:var(--violet);color:#e5d6ff}
@keyframes fade{0%,80%{opacity:1}100%{opacity:0}}
#bottom{position:absolute;left:0;right:0;bottom:0;padding:0 12px 10px 12px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));pointer-events:none}#bottom>*{margin-top:8px}
#frow{display:flex;justify-content:flex-end}
#fire{width:70px;height:70px;border-radius:50%;background:#3a1417;border-color:var(--red);color:#ffb3aa;font-size:12px;pointer-events:auto}
#fire.on{background:var(--red);color:#fff}
#tfs{pointer-events:auto;border-color:var(--blue)}
.tfr{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin:2px 0}.tfr span{min-width:0;margin-right:8px}.tfr button{flex:none;padding:5px 9px}
#contact{pointer-events:auto;border-color:var(--violet)}
#contact h4{margin:0 0 2px;font-size:14px}
#contact p{margin:0 0 6px;font-size:12px;color:var(--dim);line-height:1.35}
.row{display:grid;grid-template-columns:1fr 1fr;grid-gap:6px;gap:6px}
#acts{display:grid;grid-template-columns:repeat(5,1fr);grid-gap:6px;gap:6px;pointer-events:auto}
.ab{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 2px;min-width:0;font-size:11px;letter-spacing:.02em}
.ab small{font:500 10px var(--mono);color:var(--amber)}
.ov{position:absolute;left:0;top:0;right:0;bottom:0;background:#04060cf2;display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow:auto;touch-action:pan-y;box-sizing:border-box}
.ov .box{width:100%;max-width:540px;display:grid;grid-gap:12px;gap:12px;margin:auto 0}
.ov h1{margin:0;font-size:30px;letter-spacing:.04em;color:var(--amber);line-height:1.05}
.ov h2{margin:0;font-size:20px}
.ov p{margin:0;color:var(--dim);line-height:1.45;font-size:13px}
.ov input{font:600 15px var(--disp);color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:9px;width:100%;box-sizing:border-box}
.races{display:grid;grid-template-columns:1fr 1fr;grid-gap:6px;gap:6px}
.rc{text-align:left;display:block;padding:8px;min-width:0}
.rc.sel{border-color:var(--amber);background:#1d1a10}
.rc.apex{border-color:#7a4cd6}.rc.apex.sel{border-color:var(--amber)}
.rc b{font-size:14px;display:block;margin-bottom:3px}.rc span{display:block;margin-bottom:3px;font-size:11px;color:var(--dim);font-weight:400;letter-spacing:0;line-height:1.3}
.rc em{font:500 10px var(--mono);font-style:normal;color:var(--teal);letter-spacing:0;line-height:1.3}
.big{background:var(--amber);color:#1a1200;border-color:var(--amber);font-size:15px;padding:11px}
.cx{display:grid;grid-gap:6px;gap:6px}
.ci{border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:var(--panel)}
.ci b{font-size:13px}.ci div{font-size:11px;color:var(--dim);line-height:1.35}
.it{display:flex;align-items:center}
.it img{margin-right:10px;width:52px;height:52px;flex:none;background:#070c16;border-radius:6px;border:1px solid var(--line)}
.it>div{flex:1;min-width:0}.it>div>b{display:block;margin-bottom:3px}.it .tag{display:inline-block;margin:0 4px 3px 0}
.it button{flex:none;min-width:84px;margin-left:8px}
.tag{font:500 10px var(--mono);padding:1px 5px;border-radius:3px;border:1px solid var(--line);margin-left:4px;color:var(--dim);white-space:nowrap}
.sec{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-top:4px}
#mapc{width:100%;height:auto;border:1px solid var(--line);border-radius:6px;background:#050912}
@media (prefers-reduced-motion:reduce){.t{animation-duration:8s}}
.rc.lock{opacity:.5;border-style:dashed}.rc.lock em{color:var(--amber)}.ci.done b{color:#4fd1b5}
.ib button{padding-left:9px;padding-right:9px}#bHelp{min-width:30px}.hp{display:grid;grid-auto-flow:column;grid-gap:4px;gap:4px;margin:10px 0}.hp i{height:5px;background:var(--line);border-radius:3px}.hp i.on{background:var(--amber)}.gd p{margin:6px 0}.gd b{color:var(--amber)}
</style>

<div id="app">
<canvas id="cv"></canvas>
<div class="hud">
  <div id="hl" class="card">
    <div class="lvrow"><b id="lv">0.1</b><span id="tier">Primitive</span></div>
    <div class="bar"><i id="pbar"></i></div>

  </div>
  <div id="hr">
    <canvas id="mm" width="184" height="184" title="Open galaxy map"></canvas>
    <div class="ib"><button id="bPause">Pause</button><button id="bSpd">1x</button><button id="bCodex">Codex</button><button id="bHelp">?</button></div>
  </div>
</div>
<div id="alert"></div>
<div id="toasts"></div>
<div id="bottom">
  <div id="frow"><button id="fire">FIRE</button></div>
  <div id="tfs" class="card" hidden></div>
  <div id="contact" class="card" hidden></div>
  <div id="acts">
    <button class="ab" id="aR">Research<small id="cR"></small></button>
    <button class="ab" id="aD">Defend<small id="cD"></small></button>
    <button class="ab" id="aC">Cloak<small id="cC"></small></button>
    <button class="ab" id="aW">Fleet<small id="cW"></small></button>
    <button class="ab" id="aY">Empire<small id="cY"></small></button>
  </div>
</div>
<div id="ov" class="ov" hidden></div>
<div id="err" style="position:absolute;left:0;right:0;top:0;z-index:9;background:#600;color:#fff;font:12px monospace;padding:6px;display:none"></div>
</div>

function freePos(minD,maxD,gap){
  const objs=allObjs();
  for(let k=0;k<90;k++){const a=rnd(0,TAU),d=Math.sqrt(rnd(minD*minD,maxD*maxD)),x=HX+Math.cos(a)*d,y=HY+Math.sin(a)*d;

}

  for(let i=0;i<8;i++){const p=freePos(700,3600,260);addBody({kind:"gas",x:p.x,y:p.y,r:rnd(40,66),pk:"gas",name:genName()+" Giant",ring:Math.random()<.5,skim:false})}
  for(let i=0;i<26;i++){const p=freePos(500,3700,200),k=FREEK[ri(0,FREEK.length-1)];addBody({kind:"free",x:p.x,y:p.y,r:rnd(16,28),pk:k,name:genName()+"-"+ri(2,99),ring:Math.random()<.12,yl:ri(6,30)})}
  for(let i=0;i<3;i++){const p=freePos(1400,3600,500);addBody({kind:"bh",x:p.x,y:p.y,r:40})}
  for(let i=0;i<2;i++){const p=freePos(1200,3500,400);addBody({kind:"wh",x:p.x,y:p.y,r:30})}
  for(let i=0;i<3;i++){const p=freePos(700,1800,300),q=freePos(2600,3700,300),a=addBody({kind:"worm",x:p.x,y:p.y,r:28,hue:180+i*50}),b=addBody({kind:"worm",x:q.x,y:q.y,r:28,hue:180+i*50});a.pid=b.id;b.pid=a.id}
  for(let i=0;i<5;i++){const p=freePos(600,3600,350);const b=addBody({kind:"neb",x:p.x,y:p.y,r:rnd(220,330),h:ri(0,360)});for(let j=0;j<7;j++)spawnOrb(b.x+rnd(-b.r*.7,b.r*.7),b.y+rnd(-b.r*.7,b.r*.7),(6+1.5*G.lvl10)*1.5)}
  for(let i=0;i<3;i++){const p=freePos(1200,3600,400);addBody({kind:"pulsar",x:p.x,y:p.y,r:20})}
  for(let i=0;i<8;i++){const p=freePos(600,3600,260);addBody({kind:"ruin",x:p.x,y:p.y,r:22,name:"Ancient ruin"})}
  for(let i=0;i<3;i++){const p=freePos(1300,3600,500);addBody({kind:"haven",x:p.x,y:p.y,r:34,name:"Bandit haven"})}
  for(let i=0;i<3;i++){const p=freePos(900,3400,400),a=rnd(0,TAU);addBody({kind:"warp",x:p.x,y:p.y,r:150,vx:Math.cos(a)*rnd(8,20),vy:Math.sin(a)*rnd(8,20)})}
  for(let i=0;i<6;i++){const p=freePos(600,3600,330);const b=addBody({kind:"ast",x:p.x,y:p.y,r:190});for(let j=0;j<5;j++)spawnOrb(b.x+rnd(-140,140),b.y+rnd(-140,140))}
}
function spawnOrb(x,y,v){
  let p;if(x==null){if(Math.random()<.6){const a=rnd(0,TAU),d=rnd(250,1700);p={x:HX+Math.cos(a)*d,y:HY+Math.sin(a)*d}}else p={x:rnd(200,WORLD-200),y:rnd(200,WORLD-200)}}else p={x,y};
  G.orbs.push({x:p.x,y:p.y,v:v||(6+1.5*G.lvl10),ph:rnd(0,TAU)});
}
function newGame(name,race){
  G={name:name||"Terra",race,lvl10:1,prog:0,energy:70,pop:20,def:25,expo:6,cloak:0,cycle:0,ct:0,t:0,cd:0,whcd:0,
   wonders:[],civs:[],bodies:[],cols:[],orbs:[],cals:[],fleets:[],shots:[],fx:[],log:[],dead:false,won:false,nextId:1,timeUsed:false,
   fleet:{},queue:[],yard:0,techs:[],tf:[],lost:{},wars:[],bandits:[],cf:[],
   ship:{x:HX+130,y:HY,vx:0,vy:0,a:0},stats:{strikes:0,repelled:0,cals:0,attacks:0,colonized:0,destroyed:0,battles:0,won:0},hint:30,deadWhy:""};
  setRace();
  const st=R().start||{};
  if(st.lvl10)G.lvl10=st.lvl10;if(st.energy)G.energy+=st.energy;if(st.fleet)for(const k in st.fleet)G.fleet[k]=st.fleet[k];
  if(G.lvl10>=5)G.yard=1;
  for(let i=0;i<62;i++)spawnCiv(null,i<8);
  makeBodies();
  for(let i=0;i<50;i++)spawnOrb();
  for(const l of LEGENDS)if(l.at<=G.lvl10)spawnCiv(l);
  UI.cam.x=G.ship.x;UI.cam.y=G.ship.y;
  say("Your people look up at the stars. Be quiet, grow strong.","epic");
}

/* ---------- progress ---------- */
function checkLevel(){
  while(G.prog>=need(G.lvl10)&&G.lvl10<99&&!G.dead){G.prog-=need(G.lvl10);G.lvl10++;onLevel()}
  if(G.lvl10>=99&&!G.won){G.won=true;G.lvl10=99;onWin();save(true);showEnd()}
}
function tribulation(){
  const t=tier(),pw=40+30*t,st=effDef()+G.pop*.3+fleetPower()*.5;
  boom(HX,HY,"#c9a8ff",44);UI.shake=18;
  if(st*rnd(.7,1.3)>=pw){const e=Math.round(40+10*G.lvl10);G.energy+=e;G.prog+=Math.round(need(G.lvl10)*.15);for(let i=0;i<6;i++)spawnOrb(HX+rnd(-160,160),HY+rnd(-160,160));say("HEAVENLY TRIBULATION survived! The heavens bow. +"+e+" energy.","epic")}
  else{G.def*=.6;G.pop*=.75;G.prog*=.8;loseFleet(.15);say("HEAVENLY TRIBULATION wounds you. Defense, people and research suffer.","bad")}
}
function onLevel(){
  say("Level "+fmtL(G.lvl10)+" reached","good");metaTick();save();boom(HX,HY,"#f2b84b",18);
  if(G.lvl10%10===0){say(isIm()?"BREAKTHROUGH: you enter the "+tierName().split(" · ")[0]+" realm.":"A new era: "+TIERS[tier()]+". New civilizations appear.","epic");for(let i=0;i<4;i++)spawnCiv();if(isIm())tribulation()}
  if(G.lvl10===8)ensureBandits();
  for(const l of LEGENDS)if(l.at<=G.lvl10&&!G.civs.some(c=>c.leg===l.id)&&!(G.legDone&&G.legDone[l.id])){spawnCiv(l);say("A legendary civilization stirs somewhere in the universe.","epic")}
  for(const c of G.civs)if(c.leg==="tombkings"&&c.dormant&&G.lvl10>=40){c.dormant=false;say("The Undying Tombkings AWAKEN.","bad")}
  const w=WONDERS.find(w=>w.lvl===G.lvl10);if(w)say("Wonder unlocked: "+w.n,"good");
  const sh=SHIPS.find(s=>s.at===G.lvl10);if(sh)say("New ship class: "+sh.n,"good");
  if(!G.yard&&G.lvl10>=5)say("You can build a Shipyard.","good");
}
function spend(c){if(G.energy<c){say("Not enough energy (need "+Math.ceil(c)+")","bad");UI.shake=6;return false}G.energy-=c;return true}
function ready(){if(G.dead||G.won)return false;if(G.cd>0)return false;G.cd=.6*(1-bonus("cd"));return true}
function expo(v){G.expo=clamp(G.expo+v*R().ex*(v>0?1-Math.min(.6,bonus("stealth")):1),0,100)}
function loseFleet(f){for(const sh of SHIPS){const n=G.fleet[sh.id]||0;let k=0;for(let i=0;i<n;i++)if(Math.random()<f)k++;G.fleet[sh.id]=n-k;G.lost[sh.id]=(G.lost[sh.id]||0)+k}}

/* ---------- actions ---------- */
function actResearch(){if(!ready()||!spend(costs.res()))return;const g=resGain();G.prog+=g;expo(1.2);floatTxt(HX,HY-70,"+"+g+" research");checkLevel()}
function actDefense(){if(!ready()||!spend(costs.def()))return;const g=defGain();G.def+=g;expo(.8);floatTxt(HX,HY-70,"+"+g+" defense","#6fb7ff")}
function actCloak(){if(!ready()||!spend(costs.clk()))return;G.cloak=6;G.expo=Math.max(floorSig(),G.expo-10);say("Cloak up. Your signal fades.","good")}
function actWonder(id){
  const w=id?WONDERS.find(x=>x.id===id):availWonder();
  if(!w){say("Every unlocked wonder is built.");return false}
  if(G.wonders.includes(w.id))return false;
  if(G.lvl10<w.lvl){say(w.n+" needs level "+fmtL(w.lvl));return false}
  if(!ready()||!spend(costs.wond(w)))return false;
  G.wonders.push(w.id);expo(5);say("WONDER BUILT: "+w.n,"epic");boom(HX,HY,"#d9a8ff",30);return true;
}
function buildYard(){
  const y=YARD[G.yard];if(!y){say("The shipyard is fully upgraded.");return false}
  if(G.lvl10<y.at){say("Shipyard needs level "+fmtL(y.at));return false}
  if(!spend(y.cost))return false;G.yard++;expo(2);say(G.yard===1?"SHIPYARD built. Ships can now be produced.":"Shipyard upgraded: more ships per cycle.","epic");return true;
}
function buildShip(id){
  const s=SHIPS.find(x=>x.id===id);if(!G.yard){say("Build a shipyard first.");return false}
  if(G.lvl10<s.at){say(s.n+" needs level "+fmtL(s.at));return false}
  if(supplyUsed()+s.sup>supplyCap()){say("Fleet supply full. Expand your territory or level up.","bad");return false}
  if(!spend(costs.ship(s)))return false;G.queue.push(id);cntUp("built");expo(.5);return true;
}
const near=c=>Math.hypot(c.x-G.ship.x,c.y-G.ship.y)<c.r+70;
function cTrade(c){
  if(c.leg==="crimson"){say("The Crusade refuses to speak with heretics.","bad");return}
  if(c.leg==="warpcult"){say("The Warp-Touched only laugh. Their eyes are not their own.","bad");return}
  if(!ready()||!spend(costs.trade()))return;
  if(c.aggr>75&&!c.ally&&Math.random()<.35){say(c.name+" sneers and keeps your goods.","bad");return}
  c.trades++;c.aggr=Math.max(0,c.aggr-4);expo(1);
  if(c.leg==="syndicate"){const g=Math.round(defGain()*.8);G.def+=g;say("Syndicate engineers upgrade your defense (+"+g+")","good")}
  else if(c.leg==="starweavers"){const g=Math.round(resGain()*.8);G.prog+=g;say("The Starweavers share their insights (+"+g+" research)","good");checkLevel()}
  else if(c.leg==="forgemagi"&&Math.random()<.4&&G.yard){const sh=SHIPS.filter(x=>x.at<=G.lvl10&&x.id!=="sig"),x=sh[sh.length-1];if(x){G.fleet[x.id]=(G.fleet[x.id]||0)+1;say("The Forge-Magi bless your yards: a free "+x.n+"!","epic")}}
  else{const g=Math.round((16+3*G.lvl10)*(1+c.lvl10/150)*R().trade*(1+bonus("trade")));G.energy+=g;say("Trade with "+c.name+": +"+g+" energy","good")}
}
function cAlly(c){
  if(c.leg==="crimson"||c.leg==="warpcult"){say(c.name+" will never ally with you.","bad");return}
  if(c.ally)return;
  if(allies().length>=4){say("You already have four allies.");return}
  if(c.trades<1){say("Trade with them first so they learn to trust you.");return}
  if(c.aggr>60){say(c.name+" is too hostile. Appease them first.","bad");return}
  if(!ready()||!spend(costs.ally()))return;
  expo(2);
  if(Math.random()<.85-c.aggr/200){c.ally=true;flag("ally");if(c.leg)flag("ally:"+c.leg);say("ALLIANCE with "+c.name+"!","good")}else say(c.name+" declines your offer.","bad");
}
function cAppease(c){
  if(!ready()||!spend(costs.app()))return;
  if(c.leg==="crimson"&&Math.random()<.5){say("The Crusade spits on your tribute.","bad");return}
  c.aggr=Math.max(5,c.aggr-(c.leg==="greenhide"?35:25));expo(1);
  const f=G.fleets.find(f=>f.cid===c.id);
  if(f){G.fleets=G.fleets.filter(x=>x!==f);say("Tribute accepted. "+c.name+"'s fleet turns back.","good")}else say("Tribute offered. "+c.name+" grows calmer.","good");
}
function cAttack(c,mode){
  if(c.ally){say("They are your ally.");return}
  if(!ready()||!spend(costs.atk()))return;
  G.stats.attacks++;
  const me=(10+5*G.lvl10)*R().fire*(1+bonus("fire")*.5)*rnd(.9,1.5)*(1+allies().length*.1);
  expo(10+(HONOR.includes(c.leg)?10:0));
  const help=blocMates(c,2600).reduce((a,o)=>a+civPower(o)*.4*(o.fl===undefined?1:o.fl),0);
  if(help>0)say("Pact partners of "+c.name+" rush to its defense.","bad");
  if(me>civPower(c)+help){
    G.fleets=G.fleets.filter(f=>f.cid!==c.id);
    say("Raid on "+c.name+" succeeds!","good");
    if(mode)conquer(c,mode);else showChoice(c);
  }else{G.def*=.75;say("Your raid on "+c.name+" fails. Defense -25%.","bad")}
}
function conquer(c,mode){
  const pl=1+bonus("plunder"),e=Math.round((25+4*c.lvl10)*(c.leg==="greenhide"?2:1)*pl),p=Math.round((20+3*c.lvl10)*pl);c.alive=false;metaConquer(c);
  if(G.legDone===undefined)G.legDone={};if(c.leg)G.legDone[c.leg]=1;
  if(mode==="col"){
    G.cols.push({id:c.id,x:c.x,y:c.y,name:c.name,pk:c.pk,seed:c.seed,yl:c.lvl10,col:c.col,r:c.r,ring:c.ring});
    G.energy+=Math.round(e*.25);G.prog+=Math.round(p*.5);G.stats.colonized++;
    say(c.name+" is now part of your territory. +"+Math.round(e*.25)+" energy.","epic");
  }else{
    G.energy+=Math.round(e*1.8);G.prog+=p;G.stats.destroyed++;boom(c.x,c.y,c.col,36);
    for(let i=0;i<6;i++)spawnOrb(c.x+rnd(-90,90),c.y+rnd(-90,90));
    say(c.name+" is destroyed. Loot: "+Math.round(e*1.8)+" energy.","good");
  }
  checkLevel();
}
function cColonize(b){
  if(b.kind!=="free")return;if(!ready()||!spend(costs.col()))return;
  b.kind="gone";G.cols.push({id:b.id,x:b.x,y:b.y,name:b.name,pk:b.pk,seed:b.seed,yl:b.yl,col:"#4fd1b5",r:b.r+4,ring:b.ring});
  expo(1.5);G.stats.colonized++;say("Outpost founded on "+b.name+". Your territory grows.","epic");
}
function cSkim(b){
  if(b.skim)return;if(!ready()||!spend(costs.skim()))return;b.skim=true;expo(1);say("Gas skimmer online above "+b.name+".","good");
}

/* ---------- territory, civ fleets, diplomacy ---------- */
function mkCf(o,kind,tx,ty,pw,extra){
  const f=Object.assign({id:G.nextId++,kind,x:o.x,y:o.y,tx,ty,hx:o.x,hy:o.y,power:pw,max:pw,sp:160,cls:fleetClasses(pw),sty:o.sty,col:o.col,fid:o.id,from:o.name,a:0},extra||{});
  G.cf.push(f);return f;
}
function icptCheck(tf,c){
  for(const o of G.civs){
    if(!o.alive||o.dormant||o.ally||o===c||tf.seen[o.id])continue;
    if(Math.hypot(o.x-tf.x,o.y-tf.y)>terr(o))continue;
    const pact=c&&c.bl&&o.bl===c.bl;
    if(!(pact||o.aggr>=55)){continue}
    tf.seen[o.id]=1;
    const pw=civPower(o)*.7*(o.fl===undefined?1:o.fl);
    mkCf(o,"icpt",tf.x,tf.y,pw,{tfid:tf.id,sp:430});o.met=true;
    say(o.name+" scrambles an interception fleet!","bad");
  }
}
function callHelp(tf,c){
  for(const o of blocMates(c,2600)){
    mkCf(o,"help",c.x,c.y,civPower(o)*.5*(o.fl===undefined?1:o.fl),{tfid:tf.id,sp:300});
    say(o.name+" sends reinforcements to "+c.name+"!","bad");
  }
  if(atWar(c)){tf.ep*=.85;tf.ep0*=.85;say(c.name+" is already at war and distracted.","good")}
}
function cfStep(dt){
  for(const f of G.cf){
    if(f.done)continue;
    let tx=f.tx,ty=f.ty;
    if(f.kind==="icpt"){const tf=G.tf.find(q=>q.id===f.tfid);if(!tf){f.done=1;continue}tx=tf.x;ty=tf.y}
    else if(f.kind==="help"){const tf=G.tf.find(q=>q.id===f.tfid);if(!tf||tf.state!=="fight"){f.done=1;continue}}
    else if(f.kind==="def"&&!f.ret){const p=G.cf.find(q=>q.id===f.peer&&!q.done);if(p){tx=p.x;ty=p.y}else f.ret=1}
    if(f.ret){tx=f.hx;ty=f.hy}
    const dx=tx-f.x,dy=ty-f.y,d=Math.hypot(dx,dy)||1;f.a=Math.atan2(dy,dx);
    if(d>f.sp*dt){f.x+=dx/d*f.sp*dt;f.y+=dy/d*f.sp*dt}
    if(f.ret){if(d<50)f.done=1;continue}
    if(f.kind==="icpt"&&d<70)cfIcpt(f);
    else if(f.kind==="help"&&d<90)cfHelp(f);
    else if(f.kind==="war"){const p=G.cf.find(q=>q.id===f.peer&&!q.done);if(p&&Math.hypot(p.x-f.x,p.y-f.y)<80)cfClash(f,p);else if(!p&&d<60)cfSiege(f)}
  }
  G.cf=G.cf.filter(f=>!f.done);
}
function cfIcpt(f){
  f.done=1;const tf=G.tf.find(q=>q.id===f.tfid),o=civ(f.fid);if(!tf)return;
  const mine=tfPower(tf.ships)*(1+bonus("fhp"))+1,th=f.power*rnd(.8,1.2);let lost=0;
  boom(tf.x,tf.y,"#ff5d4d",16);
  if(tf.state==="fight")tf.hp-=th*.4;else lost=tfLoss(tf,clamp(th/(mine*2.2),.04,.55));
  if(o)o.fl=clamp((o.fl===undefined?1:o.fl)-.12,.2,1);
  say(mine>th*1.5?"Interceptors from "+f.from+" are routed.":"Intercepted by "+f.from+": "+(lost?lost+" ships lost.":"hull damage."),mine>th*1.5?"good":"bad");
  if(tfCount(tf.ships)<1&&tf.state!=="fight"){tf.done=true;say("Your task force was destroyed by interceptors.","bad")}
}
function cfHelp(f){
  f.done=1;const tf=G.tf.find(q=>q.id===f.tfid);
  if(tf&&tf.state==="fight"){tf.ep+=f.power;tf.ep0+=f.power;say("Reinforcements from "+f.from+" join the battle!","bad")}
}
function endWar(w){G.wars=G.wars.filter(x=>x!==w);for(const f of G.cf)if(f.wid===w.id)f.ret=1}
function cfClash(a,b){
  const pa=a.power*rnd(.8,1.25),pb=b.power*rnd(.8,1.25)*1.1,ca=civ(a.fid),cb=civ(b.fid),w=G.wars.find(q=>q.id===a.wid);
  boom((a.x+b.x)/2,(a.y+b.y)/2,"#ffb347",18);
  if(pa>pb){b.done=1;a.power=Math.max(a.max*.25,a.power-pb*.5);if(cb)cb.fl=clamp((cb.fl||1)-.3,.15,1)}
  else{a.done=1;if(ca)ca.fl=clamp((ca.fl||1)-.3,.15,1);b.ret=1;if(w&&Math.random()<.5)endWar(w)}
  if(ca&&cb&&(ca.met||cb.met))say("Fleets of "+ca.name+" and "+cb.name+" clash in open space.");
}
function cfSiege(a){
  const v=civ(a.tid),at=civ(a.fid),w=G.wars.find(q=>q.id===a.wid);
  if(!v||!v.alive){a.ret=1;return}
  const pd=civPower(v)*.8*(v.fl===undefined?1:v.fl)+blocMates(v).reduce((x,o)=>x+civPower(o)*.3,0);
  if(a.power*rnd(.8,1.2)>pd*1.1){
    if(v.leg){v.fl=clamp((v.fl||1)-.4,.15,1);if(v.met||at.met)say(at.name+" bloodies "+v.name+", but the legend endures.")}
    else{v.alive=false;G.fleets=G.fleets.filter(q=>q.cid!==v.id);G.tf.forEach(t=>{if(t.tid===v.id)t.state="back"});if(at)at.lvl10=Math.min(95,at.lvl10+2);spawnOrb(v.x,v.y,10+2*G.lvl10);for(let i=0;i<4;i++)spawnOrb(v.x+rnd(-90,90),v.y+rnd(-90,90),8+1.5*G.lvl10);
      if(v.met||(at&&at.met))say(at.name+" destroyed "+v.name+". The forest is quiet again.","epic");if(v.ally)say("Your ally "+v.name+" was destroyed!","bad")}
    if(w)endWar(w);a.ret=1;
  }else{
    if(at)at.fl=clamp((at.fl||1)-.2,.15,1);a.ret=1;if(w&&Math.random()<.4)endWar(w);
    if(at&&(at.met||v.met))say(v.name+" holds against "+at.name+".")
  }
}
function launchWar(w){
  const a=civ(w.a),b=civ(w.b);if(!a||!b||!a.alive||!b.alive){endWar(w);return}
  const fl=o=>o.fl===undefined?1:o.fl,help=(o)=>blocMates(o).reduce((x,m)=>x+civPower(m)*.3*fl(m),0);
  const pa=civPower(a)*fl(a)*.85+help(a),pb=civPower(b)*fl(b)*.85+help(b);
  const A=mkCf(a,"war",b.x,b.y,pa,{wid:w.id,tid:b.id,sp:150});
  mkCf(b,"def",a.x,a.y,pb,{wid:w.id,peer:A.id,sp:150});
  A.peer=G.cf[G.cf.length-1].id;
  if(b.ally)say("YOUR ALLY "+b.name+" is under attack by "+a.name+"!","bad");
  else if(a.met||b.met)say(a.name+" marches on "+b.name+".");
}
function aiDiplomacy(){
  const act=G.civs.filter(c=>c.alive&&!c.dormant);
  if(act.length<4)return;
  if(Math.random()<.12){const a=act[ri(0,act.length-1)];
    const cand=act.filter(o=>o!==a&&(!o.bl||o.bl!==a.bl)&&Math.hypot(o.x-a.x,o.y-a.y)<2200&&Math.abs(o.aggr-a.aggr)<45&&!G.wars.some(w=>(w.a===a.id&&w.b===o.id)||(w.a===o.id&&w.b===a.id)));
    if(cand.length){const b=cand[ri(0,cand.length-1)];

/* ---------- simulation step ---------- */
function step(dt){
  if(!G||G.dead||G.won)return;
  G.t+=dt;G.cd=Math.max(0,G.cd-dt);G.ct+=dt;G.hint=Math.max(0,G.hint-dt);
  while(G.ct>=CYC){G.ct-=CYC;endCycle();if(G.dead||G.won)return}
  for(const k of G.cals){k.ph+=dt;const dx=HX-k.x,dy=HY-k.y,d=Math.hypot(dx,dy);if(d>120){k.x+=dx/d*k.sp*dt;k.y+=dy/d*k.sp*dt}}
  const fpw=fleetPower();
  for(const f of G.fleets){const tx=f.tx||HX,ty=f.ty||HY,dx=tx-f.x,dy=ty-f.y,d=Math.hypot(dx,dy);f.x+=dx/d*f.sp*dt;f.y+=dy/d*f.sp*dt;if(d<60)f.done=true;
    if(fpw>0&&!f.tg&&Math.hypot(f.x-HX,f.y-HY)<900)f.power=Math.max(f.max*.4,f.power-fpw*.015*dt)}
  if(fpw>0)for(const k of G.cals)if(Math.hypot(k.x-HX,k.y-HY)<800){k.hp-=fpw*.05*dt;if(k.hp<=0)killCal(k)}
  tfStep(dt);cfStep(dt);banditStep(dt);
  for(const b of G.bodies)if(b.kind==="warp"){b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.x<200||b.x>WORLD-200)b.vx*=-1;if(b.y<200||b.y>WORLD-200)b.vy*=-1}
  for(const f of G.fleets)if(f.done){resolveStrike(f);if(G.dead)return}
  G.fleets=G.fleets.filter(f=>!f.done);
  for(const s of G.shots){s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;
    for(const k of G.cals)if(Math.hypot(k.x-s.x,k.y-s.y)<34){k.hp-=s.dmg;s.life=0;floatTxt(k.x,k.y-20,Math.round(s.dmg),"#fff");
      if(k.hp<=0)killCal(k)}
    for(const b of G.bandits)if(s.life>0&&Math.hypot(b.x-s.x,b.y-s.y)<32){b.hp-=s.dmg;s.life=0;floatTxt(b.x,b.y-18,Math.round(s.dmg),"#fff")}
    for(const f of G.fleets)if(Math.hypot(f.x-s.x,f.y-s.y)<40&&s.life>0){f.power=Math.max(f.max*.4,f.power-s.dmg*.25);s.life=0;boom(f.x,f.y,"#ff5d4d",3)}
  }
  G.shots=G.shots.filter(s=>s.life>0);G.cals=G.cals.filter(k=>k.hp>0);
  for(const o of G.fx){o.t+=dt;if(o.p){o.x+=o.vx*dt;o.y+=o.vy*dt}else o.y-=26*dt}
  G.fx=G.fx.filter(o=>o.t<o.life);
}

/* ---------- fleet command ---------- */
function oddsOf(c,frac){const sh={};for(const x of SHIPS)sh[x.id]=frac>=1?(G.fleet[x.id]||0):Math.floor((G.fleet[x.id]||0)*frac+.5);return tfPower(sh)*(1+bonus("fhp"))*(1+.15*allies().length)/(civPower(c)*1.1*doc(c).hp)}
function dispatch(c,frac){
  if(!c||!c.alive||c.ally){say("They cannot be attacked.");return false}
  if(G.tf.some(t=>t.tid===c.id)){say("A task force is already on its way to "+c.name+".");return false}
  const ships={};let n=0;
  for(const sh of SHIPS){const have=G.fleet[sh.id]||0,k=frac>=1?have:Math.floor(have*frac+.5);ships[sh.id]=k;n+=k}
  if(n<1){say("No ships to send. Build some at the shipyard.","bad");return false}
  for(const id in ships)G.fleet[id]=(G.fleet[id]||0)-ships[id];
  G.tf.push({id:G.nextId++,ships,tid:c.id,x:HX,y:HY,state:"out",ft:0,hp:1,hpmax:1,mx:0,ep:1,ep0:1,first:true,name:c.name,seen:{}});
  c.met=true;expo(4+(HONOR.includes(c.leg)?6:0));G.stats.battles++;
  say("Task force of "+n+" ships departs for "+c.name+".","epic");return true;
}
function tfLoss(tf,lf){let k=0;for(const sh of SHIPS){const n=tf.ships[sh.id]||0;let d=0;for(let i=0;i<n;i++)if(Math.random()<lf)d++;tf.ships[sh.id]=n-d;G.lost[sh.id]=(G.lost[sh.id]||0)+d;k+=d}return k}

function tfStep(dt){
  for(const tf of G.tf){

      icptCheck(tf,c);if(tf.done)continue;
      const dx=c.x-tf.x,dy=c.y-tf.y,d=Math.hypot(dx,dy),sp=330*(1+bonus("fspeed"))*R().spd;
      if(d<c.r+120){tf.state="fight";tf.ft=0;tf.mx=tfPower(tf.ships);tf.hpmax=tf.hp=Math.max(1,tf.mx*(1+bonus("fhp"))*(1+.15*allies().length));tf.ep0=tf.ep=civPower(c)*1.1*doc(c).hp;say("BATTLE at "+c.name+"!","epic");callHelp(tf,c)}
      else{tf.x+=dx/d*sp*dt;tf.y+=dy/d*sp*dt}
    }else if(tf.state==="fight"){
      if(!c||!c.alive||c.ally){tf.state="back";continue}
      tf.ft+=dt;
      if(tf.ft>=1){tf.ft-=1;
        const hf=Math.max(0,tf.hp)/tf.hpmax,d0=doc(c);
        const dm=tf.mx*hf*.16*rnd(.8,1.2)*(1+.15*allies().length)*(tf.first?1+bonus("ambush"):1);
        const de=civPower(c)*.14*rnd(.8,1.3)*d0.dmg*(tf.first&&d0.amb?1+d0.amb:1);
        tf.first=false;tf.ep-=dm;tf.hp-=de;c.fl=Math.max(.05,Math.min(1,tf.ep/tf.ep0));
        if(tf.ep<=0){tfLoss(tf,1-Math.max(0,tf.hp)/tf.hpmax);G.stats.won++;cntUp("battles");say("VICTORY at "+c.name+"!","epic");tf.state="back";c.fl=1;
          if(UI.auto)conquer(c,UI.auto);else showChoice(c);continue}
        if(tf.hp<=0){tfLoss(tf,1);say("Your task force was destroyed at "+c.name+".","bad");tf.done=true;continue}
      }
    }else{
      icptCheck(tf,null);if(tf.done)continue;
      const dx=HX-tf.x,dy=HY-tf.y,d=Math.hypot(dx,dy),sp=360*(1+bonus("fspeed"))*R().spd;
      if(d<80){tf.done=true;for(const id in tf.ships)G.fleet[id]=(G.fleet[id]||0)+tf.ships[id];if(tfCount(tf.ships))say("Task force home ("+tfCount(tf.ships)+" ships).","good")}
      else{tf.x+=dx/d*sp*dt;tf.y+=dy/d*sp*dt}
    }
  }

}
function buyTech(id){

}
function target(){
  const s=G.ship;let best=null,bd=700;
  for(const t of G.cals.concat(G.fleets,G.bandits)){const d=Math.hypot(t.x-s.x,t.y-s.y);if(d<bd){bd=d;best=t}}
  return best;
}
let fireCd=0;
function tryFire(dt){
  fireCd-=dt;if(!UI.fire||fireCd>0||G.dead||G.won)return;
  const t=target();if(!t){fireCd=.2;return}
  if(G.energy<costs.shot()){fireCd=.2;return}
  G.energy-=costs.shot();fireCd=.2;
  const s=G.ship,a=Math.atan2(t.y-s.y,t.x-s.x);
  G.shots.push({x:s.x,y:s.y,vx:Math.cos(a)*820,vy:Math.sin(a)*820,life:1,dmg:shotDmg()});
  s.a=a;
}
function updateShip(dt){
  const s=G.ship;let ix=0,iy=0;const k=UI.keys;
  if(k.ArrowLeft||k.a)ix--;if(k.ArrowRight||k.d)ix++;if(k.ArrowUp||k.w)iy--;if(k.ArrowDown||k.s)iy++;
  if(UI.joy){const dx=UI.joy.x-UI.joy.ox,dy=UI.joy.y-UI.joy.oy,d=Math.hypot(dx,dy);if(d>8){const m=d>60?1:d/60;ix=dx/d*m;iy=dy/d*m}}
  const m=Math.hypot(ix,iy);if(m>1){ix/=m;iy/=m}
  const sp=520*R().spd*(1+bonus("speed"));
  s.vx+=(ix*sp-s.vx)*Math.min(1,dt*5);s.vy+=(iy*sp-s.vy)*Math.min(1,dt*5);
  G.whcd=Math.max(0,G.whcd-dt);
  const rad=520*(1+bonus("speed")*2+bonus("sensor"));
  for(const b of G.bodies){
    const dx=b.x-s.x,dy=b.y-s.y,d=Math.hypot(dx,dy);
    if(b.kind==="bh"){
      if(d<420){const pull=(R().bh?.3:1)*1500*Math.pow(1-d/420,2);s.vx+=dx/d*pull*dt;s.vy+=dy/d*pull*dt;
        if(d>110){G.prog+=need(G.lvl10)*.005*dt;if(Math.random()<.02)G.fx.push({x:s.x+rnd(-20,20),y:s.y+rnd(-20,20),txt:"+data",c:"#b58cff",t:0,life:1})}}
      if(d<b.r+8&&!R().bh){const p=freePos(900,3200,200);s.x=p.x;s.y=p.y;s.vx=s.vy=0;G.energy*=.85;UI.cam.x=s.x;UI.cam.y=s.y;say("Dragged past the horizon and spat out elsewhere. Energy -15%.","bad");checkLevel()}
      else if(d<b.r+8){s.vx-=dx/d*400;s.vy-=dy/d*400}
    }else if(b.kind==="wh"){if(d<260){s.vx-=dx/d*180*dt;s.vy-=dy/d*180*dt}}
    else if(b.kind==="worm"){if(d<b.r+16&&G.whcd<=0){const q=G.bodies.find(x=>x.id===b.pid);if(q){s.x=q.x+Math.cos(s.a)*(q.r+70);s.y=q.y+Math.sin(s.a)*(q.r+70);s.vx=s.vy=0;G.whcd=3;UI.cam.x=s.x;UI.cam.y=s.y;flag("wormhole");say("Wormhole jump!","good")}}}
    else if(b.kind==="warp"){if(d<b.r){G.expo=clamp(G.expo+.35*dt*R().ex,0,100);if(Math.random()<dt*.18)warpEvent()}}
    else if(b.kind==="pulsar"){if(d<420){G.prog+=need(G.lvl10)*.004*dt;G.expo=clamp(G.expo+.25*dt*R().ex,0,100)}}
    else if(b.kind==="neb"){if(d<b.r)G.expo=Math.max(floorSig(),G.expo-.4*dt)}
    else if(b.kind==="ruin"&&d<b.r+34){lootRuin(b)}
    if((b.kind==="gas"||b.kind==="free")&&!b.met&&d<rad*.6){b.met=true}
  }
  s.x=clamp(s.x+s.vx*dt,40,WORLD-40);s.y=clamp(s.y+s.vy*dt,40,WORLD-40);
  if(Math.hypot(s.vx,s.vy)>20)s.a=Math.atan2(s.vy,s.vx);
  for(let i=G.orbs.length-1;i>=0;i--){const o=G.orbs[i];if(Math.hypot(o.x-s.x,o.y-s.y)<40){const v=Math.round(o.v*R().en*R().orb*(1+bonus("orb")));G.energy+=v;floatTxt(o.x,o.y,"+"+v);G.orbs.splice(i,1)}}
  for(const c of G.civs)if(c.alive&&!c.met&&Math.hypot(c.x-s.x,c.y-s.y)<rad*.7){c.met=true;cntUp("met");
    say(c.leg?"LEGENDARY CIVILIZATION FOUND: "+c.name+" (Lv "+fmtL(c.lvl10)+")":"Discovered "+c.name+" (Lv "+fmtL(c.lvl10)+")",c.leg?"epic":"");}
}
function lootRuin(b){
  b.kind="gone";const r=Math.random(),L=G.lvl10;
  if(r<.4){const g=Math.round(need(L)*.5);G.prog+=g;say("Ancient archives decoded: +"+g+" research.","epic");checkLevel()}
  else if(r<.65){const g=120+15*L;G.energy+=g;say("A derelict power core: +"+g+" energy.","epic")}
  else if(r<.85){const s=SHIPS.filter(x=>x.at<=L+10);const sh=s[ri(0,s.length-1)];G.fleet[sh.id]=(G.fleet[sh.id]||0)+1;say("Salvaged an intact "+sh.n+"!","epic")}
  else{if(L>=20){spawnCal(CALS.filter(c=>c.min<=L)[0]);say("The ruins' guardians awaken!","bad")}else{G.energy*=.8;say("A trap! Energy -20%.","bad")}}
}

const GUIDE=[
 ["The goal","<p>You lead a young civilization in the <b>Dark Forest</b>: the universe is full of hunters, and any civilization that shows itself can be destroyed.</p><p>Grow from <b>level 0.1</b> to <b>9.9</b> to win. Levels 7.0 and above are god-level: Heavenly, Divine and Origin.</p><p>Hide when you are weak, build strength, and strike first when you are ready.</p>"],
 ["Controls","<p><b>Move:</b> drag on the screen like a joystick, or use WASD / arrow keys.</p><p><b>Fire:</b> hold the FIRE button (or Space). Your envoy aims by itself and shoots raiders, calamities and strike fleets. Shots cost a little energy.</p><p><b>Bottom buttons (keys 1 to 5):</b> Research, Defend, Cloak, Fleet and Empire.</p><p><b>Top:</b> Pause, game speed, Codex (civilizations met and a chronicle), and this guide (?). Tap the small map to open the galaxy map.</p>"],
 ["Your resources","<p><b>Energy</b> pays for everything. Collect the gold orbs, and earn it from your world, colonies and gas skimmers.</p><p><b>Research</b> raises your level. Press Research, then watch the green bar fill.</p><p><b>Defense</b> protects you from strike fleets. Your fleet adds to it.</p><p><b>Population</b> limits how well you work. Plague and calamities hurt it.</p><p>Time moves in <b>cycles</b> of 4 seconds. Every cycle you earn energy and the world changes.</p>"],
 ["Signal: the golden rule","<p>Everything loud raises your <b>Signal</b> (the red bar): research, defense, trade, raids, colonies, war. A high signal calls hunters to your home.</p><p>The dashed red ring around your world shows how far hunters can notice you. Bigger signal means a bigger ring.</p><p><b>Cloak</b> hides you for a while. Nebulae also make you quieter. Pulsars and warp storms make you louder.</p><p>Until level 2.0 you are protected. After that, stay quiet and keep your defense above the power of nearby civilizations.</p>"],
 ["Other civilizations","<p>Fly near a planet with a name to open its contact panel:</p><p><b>Trade</b> gives energy and calms them. <b>Ally</b> (needs one trade first) gives research each cycle and halves hostility. <b>Appease</b> sends tribute and cancels a strike fleet. <b>Raid</b> is a quick, risky attack. <b>Send fleet</b> launches a real war.</p><p>Legendary civilizations have special rules. Read their description when you meet them.</p>"],
 ["Fleet, shipyard and war","<p>At level 0.5 build a <b>Shipyard</b> (Empire menu). Queue ships. New classes unlock as you level. <b>Supply</b> limits fleet size and grows with level and colonies.</p><p>The home fleet protects your world and shoots enemies nearby. In Fleet you can send <b>task forces</b> (all or half) against a known civilization. Watch the live battle on the map and tap <b>Recall</b> if it goes badly.</p><p>If you win, choose: <b>Colonize</b> (steady energy, bigger territory, but louder) or <b>Destroy</b> (big loot, no noise).</p>"],
 ["Territory and rival wars","<p>Every civilization has <b>territory</b> (the dotted circle). Higher-level civilizations have stronger fleets and a larger zone.</p><p>If your task force crosses a hostile zone, <b>interceptors</b> attack it. If you attack a civilization, its <b>pact partners</b> send reinforcements.</p><p>Rivals also form <b>pacts</b> (gold lines) and fight <b>wars</b> (red lines) with each other. A civilization at war is distracted, which is your chance to strike. Check the Codex for current wars and pacts.</p>"],
 ["Wonders and technology","<p><b>Wonders</b> are huge buildings that give permanent bonuses. Unlock them as you level, and pay energy to build them. Each race also has its own special wonders.</p><p><b>Technology</b> gives bonuses too. Every race has its own unique techs, plus a few shared ones. Open both from the Empire menu.</p><p><b>Colonies</b>: fly to an empty planet and found an outpost. Gas giants can have a skimmer for steady energy.</p>"],
 ["Dangers","<p><b>Strike fleets:</b> launched by hunters who notice you. Raise defense, cloak, appease, or shoot them down before they arrive.</p><p><b>Calamities:</b> four great threats (swarm, machines, demons, anomaly). Destroy them or wait; they leave after 8 cycles.</p><p><b>Bandits:</b> raiders from bandit havens steal energy and pillage colonies. Shoot them for loot.</p><p><b>Warp storms and black holes:</b> risky but rewarding. Black holes give research near the edge and drag you in if you get too close.</p>"],

function showHelp(n,back){
  n=n||0;const g=GUIDE[n];
  openOv('<div class="box gd"><h2>Guide · '+g[0]+'</h2><div class="hp">'+GUIDE.map((x,i)=>'<i class="'+(i<=n?"on":"")+'"></i>').join("")+'</div>'+g[1]+
   '<div class="row">'+(n>0?'<button id="hpv">Back</button>':'')+(n<GUIDE.length-1?'<button class="big" id="hnx">Next</button>':'<button class="big" id="hcl">Done</button>')+'</div>'+
   '<div class="row"><button id="hix">Close guide</button></div></div>');
  const close=()=>{if(P){P.meta.tut=1;saveMeta()}back?back():closeOv()};
  if($("hpv"))$("hpv").onclick=()=>showHelp(n-1,back);if($("hnx"))$("hnx").onclick=()=>showHelp(n+1,back);
  if($("hcl"))$("hcl").onclick=close;$("hix").onclick=close;
}

      box.innerHTML='<h4>'+c.name+'<span class="tag">Lv '+fmtL(c.lvl10)+'</span><span class="tag">'+c.race+'</span><span class="tag">'+mood+'</span></h4>'+
       '<p>'+(c.d?c.d+" ":"")+'Fleet power '+Math.round(civPower(c))+' ('+doc(c).t+'). '+(c.bl?'In a pact with '+blocMates(c).length+' other civ(s). ':'')+(atWar(c)?'AT WAR. ':'')+'Defends '+Math.round(terr(c))+' units around it. '+(fleetPower()>0?'Your fleet odds: '+oddsTxt(oddsOf(c,1))+'.':'You have no fleet yet.')+'</p>'+
       '<div class="row"><button data-k="t">Trade '+costs.trade()+'</button><button data-k="a">'+(c.ally?"Allied":"Ally "+costs.ally())+'</button><button data-k="p">Appease '+costs.app()+'</button><button data-k="x" style="border-color:var(--red)">Raid '+costs.atk()+'</button><button data-k="f" style="border-color:var(--red)">Send fleet</button></div>';
      box.querySelectorAll("button").forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(c.dormant&&k!=="x"&&k!=="f"&&k!=="t"){say("They sleep. Nothing answers.");return}
        k==="t"?cTrade(c):k==="a"?cAlly(c):k==="p"?cAppease(c):k==="f"?(dispatch(c,1)):cAttack(c);lastContact=""})}}
}

/* ---------- overlays ---------- */
const ov=$("ov");
function openOv(html){if(G&&G.race==="Immortal"&&!ov.hidden!==undefined)html=html.replace(/>([^<]+)</g,(m,t)=>">"+IW(t)+"<");UI.paused=true;ov.hidden=false;ov.innerHTML=html;ov.scrollTop=0}
function closeOv(){ov.hidden=true;ov.innerHTML="";UI.paused=false;$("bPause").textContent="Pause";lastContact=""}
function showIntro(){
  if(!P){const cur=LS.get("dfa_cur");if(cur){const p=loadProfile(cur);if(p&&!p.pin)P=p}}
  P?showMenu():showLogin();
}
function showEnd(){
  const s=G.stats;
  openOv('<div class="box"><h1>'+(G.won?"LEVEL 9.9 REACHED":"CIVILIZATION LOST")+'</h1><p>'+(G.won?G.name+" stands at the Origin, beyond every hunter in the dark forest. The ten thousand races bow.":G.deadWhy)+'</p>'+
   '<div class="cx"><div class="ci"><b>Final level '+fmtL(G.lvl10)+' · '+rname(G.race)+'</b><div>'+G.cycle+' cycles · '+G.wonders.length+' wonders · '+G.cols.length+' colonies · '+s.colonized+' worlds claimed · '+s.destroyed+' destroyed · '+s.won+' of '+s.battles+' fleet battles won · '+s.cals+' calamities destroyed · '+s.repelled+' of '+s.strikes+' strikes repelled</div></div></div>'+
   '<button class="big" id="again">Main menu</button>'+(!G.won&&P&&G.slot!==undefined&&readSlot(G.slot)&&readSlot(G.slot).g?'<button id="rl">Load last save</button>':'')+'</div>');
  $("again").onclick=()=>{G=null;showIntro()};if($("rl"))$("rl").onclick=()=>{const sl=G.slot;if(!loadSlot(sl)){G=null;showMenu("That save could not be loaded.")}};
}
function showChoice(c){
  const e=Math.round((25+4*c.lvl10)*(c.leg==="greenhide"?2:1));
  openOv('<div class="box"><h2>'+c.name+' has fallen</h2><p>Their fleets are broken. What do you do with the survivors?</p>'+
   '<div class="ci"><b>Colonize</b><div>Add the world to your territory. Steady energy every cycle, +3 fleet supply, but a larger empire is louder. Immediate loot: '+Math.round(e*.25)+' energy.</div></div><button class="big" id="kc">Colonize</button>'+
   '<div class="ci"><b>Destroy</b><div>Burn it down. Big one-time loot: '+Math.round(e*1.8)+' energy and energy orbs left in the ruins. No territory, no extra noise.</div></div><button id="kd" style="border-color:var(--red)">Destroy</button></div>');
  $("kc").onclick=()=>{closeOv();conquer(c,"col")};$("kd").onclick=()=>{closeOv();conquer(c,"des")};
}
function diploHtml(){
  const w=G.wars.map(x=>{const a=civ(x.a),b=civ(x.b);return a&&b&&(a.met||b.met)?'<div class="ci"><div><b>'+(a.met?a.name:"An unknown civ")+'</b> is at war with <b>'+(b.met?b.name:"an unknown civ")+'</b></div></div>':""}).join("");
  const bl={};G.civs.forEach(c=>{if(c.alive&&c.met&&c.bl)(bl[c.bl]=bl[c.bl]||[]).push(c.name)});
  const p=Object.keys(bl).filter(k=>bl[k].length>1).map(k=>'<div class="ci"><div>Pact: '+bl[k].join(", ")+'</div></div>').join("");
  return '<div class="sec">Wars and pacts</div><div class="cx">'+(w+p||'<div class="ci"><div>No known wars or pacts. The forest is quiet, for now.</div></div>')+'</div>';
}
function showCodex(){
  const seen=G.civs.filter(c=>c.met).sort((a,b)=>(b.leg?1:0)-(a.leg?1:0)||b.lvl10-a.lvl10);
  openOv('<div class="box"><h2>Codex</h2><div class="sec">Civilizations met ('+seen.length+')</div><div class="cx">'+
   (seen.map(c=>'<div class="ci"><b style="color:'+c.col+'">'+c.name+'</b><span class="tag">Lv '+fmtL(c.lvl10)+'</span><span class="tag">'+(c.alive?(c.ally?"ally":c.dormant?"asleep":c.aggr>70?"hostile":c.aggr>40?"wary":"friendly"):"gone")+'</span><div>'+(c.d||c.race+" civilization")+'</div></div>').join("")||'<div class="ci"><div>Nobody yet. Fly out and look.</div></div>')+
   '</div>'+diploHtml()+'<div class="sec">Territory ('+(G.cols.length+1)+' worlds)</div><div class="cx">'+G.cols.map(c=>'<div class="ci"><b>'+c.name+'</b><div>Colony · yields '+((2+.25*c.yl)*R().col).toFixed(1)+' energy per cycle</div></div>').join("")+'</div>'+
   '<div class="sec">Chronicle</div><div class="cx">'+G.log.slice(-10).reverse().map(l=>'<div class="ci"><div>Cycle '+l.c+': '+l.m+'</div></div>').join("")+'</div>'+
   '<button class="big" id="cl">Back to game</button></div>');
  $("cl").onclick=closeOv;
}
function showWonders(){
  openOv('<div class="box"><h2>Wonders</h2><p>Great works change your civilization for good. Each one makes a bigger signal for a moment.</p><div class="cx">'+
   WONDERS.map(w=>{const built=G.wonders.includes(w.id),lock=G.lvl10<w.lvl;return '<div class="ci it"><img src="'+wonderIcon(w.id)+'" alt=""><div><b style="color:'+(built?"#d9a8ff":"inherit")+'">'+w.n+'</b><span class="tag">Lv '+fmtL(w.lvl)+'</span><div>'+w.d+'</div></div>'+
     '<button data-w="'+w.id+'"'+(built||lock?" disabled":"")+'>'+(built?"Built":lock?"Locked":costs.wond(w)+" E")+'</button></div>'}).join("")+
   '</div><button class="big" id="cl">Back to game</button></div>');
  $("cl").onclick=closeOv;
}
function showYard(){
  const cap=supplyCap(),used=supplyUsed(),y=YARD[G.yard];
  openOv('<div class="box"><h2>Shipyard</h2>'+
   '<div class="ci"><b>'+(G.yard?"Shipyard level "+G.yard:"No shipyard yet")+'</b><span class="tag">fleet power '+Math.round(fleetPower())+'</span><span class="tag">supply '+used+'/'+cap+'</span><div>'+(G.yard?"Builds "+YARD[G.yard-1].tp+" ship"+(YARD[G.yard-1].tp>1?"s":"")+" per cycle. Queue: "+G.queue.length+". Your fleet adds to defense, firepower and invasion strength.":"A factory in orbit that builds your fleet.")+'</div></div>'+
   (y?'<button class="big" data-y="1"'+(G.lvl10<y.at?" disabled":"")+'>'+(G.yard?"Upgrade shipyard ":"Build shipyard ")+(G.lvl10<y.at?"(needs Lv "+fmtL(y.at)+")":y.cost+" E")+'</button>':"")+
   '<div class="cx">'+SHIPS.map(s=>{const lock=G.lvl10<s.at||!G.yard;return '<div class="ci it"><img src="'+shipIcon(s.id)+'" alt=""><div><b>'+s.n+'</b><span class="tag">power '+Math.round(s.pw*R().fleet)+'</span><span class="tag">supply '+s.sup+'</span><span class="tag">owned '+(G.fleet[s.id]||0)+'</span><div>'+s.d+(G.lvl10<s.at?" Unlocks at Lv "+fmtL(s.at)+".":"")+'</div></div>'+
     '<button data-s="'+s.id+'"'+(lock?" disabled":"")+'>'+costs.ship(s)+' E</button></div>'}).join("")+'</div>'+
   '<button class="big" id="cl">Back to game</button></div>');
  $("cl").onclick=closeOv;
}
function oddsTxt(r){return(r>1.8?"overwhelming":r>1.2?"good":r>.85?"even":"poor")+" ("+r.toFixed(1)+"x)"}
function showFleet(){
  const hf=SHIPS.filter(x=>G.fleet[x.id]).map(x=>G.fleet[x.id]+" "+x.n+(G.fleet[x.id]>1?"s":"")).join(", ")||"none yet";
  const tg=G.civs.filter(c=>c.alive&&c.met&&!c.ally).sort((a,b)=>Math.hypot(a.x-HX,a.y-HY)-Math.hypot(b.x-HX,b.y-HY)).slice(0,14);
  openOv('<div class="box"><h2>Fleet command</h2><div class="ci"><b>Home fleet</b><span class="tag">power '+Math.round(fleetPower())+'</span><span class="tag">supply '+supplyUsed()+'/'+supplyCap()+'</span><div>'+hf+'. The home fleet shoots at strike fleets and calamities near your world. Ships you send away stop defending until they return.</div></div>'+
   (G.tf.length?'<div class="sec">Task forces</div><div class="cx">'+G.tf.map(t=>'<div class="ci"><b>To '+t.name+'</b><span class="tag">'+tfCount(t.ships)+' ships</span><span class="tag">'+t.state+'</span>'+(t.state==="back"?"":'<div class="row"><button data-r="'+t.id+'">Recall</button></div>')+'</div>').join("")+'</div>':"")+
   '<div class="sec">Targets you know ('+tg.length+')</div><div class="cx">'+
   (tg.map(c=>'<div class="ci"><b style="color:'+c.col+'">'+c.name+'</b><span class="tag">Lv '+fmtL(c.lvl10)+'</span><span class="tag">'+c.race+'</span><div>'+doc(c).t+' · fleet power '+Math.round(civPower(c))+' · '+Math.round(Math.hypot(c.x-HX,c.y-HY)/100)+' units away · odds '+oddsTxt(oddsOf(c,1))+'</div><div class="row"><button data-f="'+c.id+'|1">Send all</button><button data-f="'+c.id+'|.5">Send half</button></div></div>').join("")||'<div class="ci"><div>No known targets. Fly out and discover civilizations first.</div></div>')+
   '</div><button class="big" id="cl">Back to game</button></div>');
  $("cl").onclick=closeOv;
}
function showEmpire(){
  openOv('<div class="box"><h2>Empire</h2><div class="ci"><b>'+G.name+' · '+rname(G.race)+'</b><div>Level '+fmtL(G.lvl10)+' · '+(1+G.cols.length)+' worlds · fleet power '+Math.round(fleetPower())+' · '+G.techs.length+' technologies · '+G.wonders.length+' wonders</div></div>'+
   '<button class="big" data-e="t">'+(isIm()?"Immortal Arrays":"Technology")+'</button><button class="big" data-e="y">Shipyard</button><button class="big" data-e="w">Wonders</button><button class="big" data-e="m">Save and main menu</button><button id="cl">Back to game</button></div>');
  $("cl").onclick=closeOv;
}
function showTech(){
  openOv('<div class="box"><h2>'+(isIm()?"Immortal Arrays":"Technology")+'</h2><p>'+(isIm()?"The Immortal Dao does not build machines. Inscribe arrays of spirit and heaven instead.":"Your race has its own technologies, and a few are shared by every civilization.")+'</p><div class="cx">'+
   techList().map(t=>{const own=G.techs.indexOf(t.id)>=0,lock=G.lvl10<t.lvl;return '<div class="ci it"><div><b style="color:'+(own?"#4fd1b5":"inherit")+'">'+t.n+'</b><span class="tag">Lv '+fmtL(t.lvl)+'</span>'+(t.race?'<span class="tag">'+rname(G.race)+'</span>':'')+'<div>'+t.d+'</div></div><button data-t="'+t.id+'"'+(own||lock?" disabled":"")+'>'+(own?(isIm()?"Inscribed":"Known"):lock?"Locked":techCost(t)+" E")+'</button></div>'}).join("")+
   '</div><button class="big" id="cl">Back to game</button></div>');
  $("cl").onclick=closeOv;
}
function showMap(){
  openOv('<div class="box"><h2>Galaxy map</h2><canvas id="mapc" width="520" height="520"></canvas>'+
   '<p>Amber: your home. Teal squares: territory. Purple: legendary civilizations. Red: strike fleets. Black rings: black holes. White: white holes. Hollow rings: wormhole pairs. Tan dots: gas giants. Faint clouds: nebulae. Orange: bandits. Red dots: bandit havens. Purple rings: warp storms. Gold lines: pacts. Red lines: wars.</p><button class="big" id="cl">Back to game</button></div>');
  drawMap($("mapc").getContext("2d"),520,true);$("cl").onclick=closeOv;
}
ov.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b||!G)return;
  if(b.dataset.w){if(actWonder(b.dataset.w))showWonders()}
  else if(b.dataset.s){if(buildShip(b.dataset.s))showYard()}
  else if(b.dataset.y){if(buildYard())showYard()}
  else if(b.dataset.t){if(buyTech(b.dataset.t))showTech()}
  else if(b.dataset.e){const k=b.dataset.e;k==="m"?(save(),G=null,showIntro()):k==="t"?showTech():k==="y"?showYard():showWonders()}
  else if(b.dataset.f){const p=b.dataset.f.split("|"),c=G.civs.find(x=>String(x.id)===p[0]);if(c&&dispatch(c,parseFloat(p[1])))closeOv();else if(c)showFleet()}
  else if(b.dataset.r){const t=G.tf.find(x=>String(x.id)===b.dataset.r);if(t){recallTF(t);showFleet()}}
});

/* ---------- input ---------- */
cv.addEventListener("pointerdown",e=>{if(UI.joy||UI.paused)return;cv.setPointerCapture(e.pointerId);const r=cv.getBoundingClientRect();UI.joy={id:e.pointerId,ox:e.clientX-r.left,oy:e.clientY-r.top,x:e.clientX-r.left,y:e.clientY-r.top}});
cv.addEventListener("pointermove",e=>{if(UI.joy&&UI.joy.id===e.pointerId){const r=cv.getBoundingClientRect();UI.joy.x=e.clientX-r.left;UI.joy.y=e.clientY-r.top}});
const endJoy=e=>{if(UI.joy&&UI.joy.id===e.pointerId)UI.joy=null};
cv.addEventListener("pointerup",endJoy);cv.addEventListener("pointercancel",endJoy);
addEventListener("keydown",e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;UI.keys[k]=true;
  if(!G||UI.paused)return;if(k===" "){UI.fire=true;e.preventDefault()}
  if(k==="1")actResearch();if(k==="2")actDefense();if(k==="3")actCloak();if(k==="4")showFleet();if(k==="5")showEmpire()});
addEventListener("keyup",e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;UI.keys[k]=false;if(k===" ")UI.fire=false});
const fb=$("fire");
fb.addEventListener("pointerdown",e=>{UI.fire=true;fb.classList.add("on");fb.setPointerCapture(e.pointerId)});
const fu=()=>{UI.fire=false;fb.classList.remove("on")};fb.addEventListener("pointerup",fu);fb.addEventListener("pointercancel",fu);
$("aR").onclick=()=>actResearch();$("aD").onclick=()=>actDefense();$("aC").onclick=()=>actCloak();
$("aW").onclick=()=>{if(G&&ov.hidden)showFleet()};$("aY").onclick=()=>{if(G&&ov.hidden)showEmpire()};
mm.onclick=()=>{if(G&&ov.hidden)showMap()};
$("bPause").onclick=()=>{if(!G||!ov.hidden)return;UI.paused=!UI.paused;$("bPause").textContent=UI.paused?"Resume":"Pause"};
$("bSpd").onclick=()=>{UI.speed=UI.speed%3+1;$("bSpd").textContent=UI.speed+"x"};
$("bCodex").onclick=()=>{if(G&&ov.hidden)showCodex()};$("bHelp").onclick=()=>{if(G&&ov.hidden)showHelp(0)};
addEventListener("resize",resize);addEventListener("blur",()=>{UI.fire=false;UI.keys={}});
document.addEventListener("visibilitychange",()=>{if(document.hidden)save()});

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;UI.t+=dt;UI.shake=Math.max(0,UI.shake-dt*40);
  if(G&&!UI.paused&&!G.dead&&!G.won){updateShip(dt);tryFire(dt);step(dt*UI.speed)}
  if(G){UI.cam.x+=(G.ship.x-UI.cam.x)*Math.min(1,dt*6);UI.cam.y+=(G.ship.y-UI.cam.y)*Math.min(1,dt*6);hudT-=dt;if(hudT<=0){hudT=.12;hud()}}
  draw();requestAnimationFrame(frame);
}
resize();
window.__DF={get G(){return G},step,endCycle,newGame,actResearch,actDefense,actCloak,actWonder,availWonder,buildYard,buildShip,cTrade,cAlly,cAppease,cAttack,cColonize,cSkim,conquer,costs,effDef,civPower,shotDmg,nextWonder,popf,UI,spawnCal,CALS,floorSig,need,fleetPower,supplyCap,supplyUsed,SHIPS,RACES,YARD,showYard,showWonders,showMap,showCodex,showChoice,lootRuin,updateShip,dispatch,recallTF,buyTech,techList,techCost,tfPower,oddsOf,showFleet,showEmpire,showTech,aiDiplomacy,tribulation,ensureBandits,spawnBandit,launchWar,cfStep,banditStep,warpEvent,terr,blocMates,civ,CODE,unlocked,tierName,killBandit,get P(){return P},startGame,loadSlot,readSlot,flag,cntUp,REQ,ACH,raceOpen,checkMeta,login,showMenu,showLogin,showRaces,showProgress,showHelp,GUIDE,showBackup,exportCode,importCode,metaTick,save};
showIntro();
requestAnimationFrame(frame);
</script>
